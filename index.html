<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixture Proportions Calculator</title>
    <meta name="description" content="Calculate mixture proportions for Magnesium, Potassium, and Sodium.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <main class="calculator-container">
        <header>
            <div id="print-timestamp" class="print-only"></div>
            <h1>Mixture Calculator</h1>
            <p>Maintain perfect proportions. Enter an amount for any ingredient to calculate the corresponding amounts of the others.</p>
        </header>

        <div class="inputs-grid">
            <div class="input-group">
                <label for="magnesium">Magnesium (Mg)</label>
                <div class="input-wrapper">
                    <input type="number" id="magnesium" placeholder="275" min="0" step="any">
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="input-group">
                <label for="potassium">Potassium (K)</label>
                <div class="input-wrapper">
                    <input type="number" id="potassium" placeholder="680" min="0" step="any">
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="input-group">
                <label for="sodium">Sodium (Na)</label>
                <div class="input-wrapper">
                    <input type="number" id="sodium" placeholder="9500" min="0" step="any">
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="input-divider"></div>

            <div class="input-group total-group">
                <label for="total">Total Mixture</label>
                <div class="input-wrapper">
                    <input type="number" id="total" placeholder="10455" min="0" step="any">
                    <span class="unit">g</span>
                </div>
            </div>
        </div>

        <div class="proportions-section">
            <div class="proportions-header">
                <span>Constant Proportions</span>
            </div>
            <div class="proportions-visual">
                <div class="bar-segment mg-bar" title="Magnesium: ~2.63%"><span>2.6%</span></div>
                <div class="bar-segment k-bar" title="Potassium: ~6.50%"><span>6.5%</span></div>
                <div class="bar-segment na-bar" title="Sodium: ~90.87%"><span>90.9%</span></div>
            </div>
            <div class="proportions-legend">
                <span class="legend-item"><span class="dot dot-mg"></span> Mg</span>
                <span class="legend-item"><span class="dot dot-k"></span> K</span>
                <span class="legend-item"><span class="dot dot-na"></span> Na</span>
            </div>
        </div>

        <div class="actions">
            <button id="reset-btn" class="btn-secondary">Reset Calculator</button>
            <button id="print-btn" class="btn-primary">Print Mixture</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
